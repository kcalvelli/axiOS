name: Code Formatting

# Runs on every PR — unfiltered — because this is a required check. A path
# filter on pull_request means the workflow is skipped (and never reports a
# status) on any PR touching no .nix files, leaving branch protection waiting
# forever on a check that never arrives. Ask the flake.lock / manifest bumpers
# how that went. Push keeps its filter; only PR gating must be unconditional.
on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - '**.nix'
  workflow_dispatch:

jobs:
  check-formatting:
    name: Check Nix formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check formatting
        run: |
          echo "🎨 Checking Nix code formatting..."
          if nix fmt -- --fail-on-change .; then
            echo "✅ All files properly formatted"
          else
            echo "❌ Formatting issues found"
            echo ""
            echo "To fix locally, run:"
            echo "  nix fmt ."
            echo "  # OR: ./scripts/fmt.sh"
            echo ""
            exit 1
          fi
